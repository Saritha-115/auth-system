sonar.projectKey=Saritha-115_auth-system
sonar.organization=saritha-115
sonar.host.url=https://sonarcloud.io

# Sources
sonar.sources=auth-service/src/main/java,user-service/src/main/java,api-gateway/src/main/java
sonar.tests=auth-service/src/test/java,user-service/src/test/java,api-gateway/src/test/java

# ========== EXPLICIT PATHS FOR COMPILED FILES ==========
sonar.java.binaries=auth-service/target/classes,user-service/target/classes,api-gateway/target/classes
sonar.java.test.binaries=auth-service/target/test-classes,user-service/target/test-classes,api-gateway/target/test-classes

# Coverage
sonar.coverage.jacoco.xmlReportPaths=auth-service/target/site/jacoco/jacoco.xml,user-service/target/site/jacoco/jacoco.xml,api-gateway/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/model/**, **/dto/**, **/config/**, **/*Exception.java

# Encoding
sonar.sourceEncoding=UTF-8